name: viralclip-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-viralclip}
      MYSQL_USER: ${DB_USER:-viralclip}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [backend]
    logging: *default-logging
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis-data:/data
    networks: [backend]
    logging: *default-logging
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command: ['node', 'apps/api/dist/db/migrate-cli.js']
    env_file: .env
    environment:
      DB_HOST: mysql
      REDIS_URL: ${REDIS_URL:?set REDIS_URL with the Redis password}
    networks: [backend]
    logging: *default-logging
    depends_on:
      mysql:
        condition: service_healthy
    profiles: [tools]
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      REDIS_URL: ${REDIS_URL:?set REDIS_URL with the Redis password}
      AI_SERVICE_URL: http://ai:8000
      LOCAL_STORAGE_DIR: /data/storage
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS to the public https origin}
      APP_URL: ${APP_URL:?set APP_URL to the public https origin}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:?set GOOGLE_REDIRECT_URI to the public callback}
    volumes:
      - storage:/data/storage
    networks: [backend]
    logging: *default-logging
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      REDIS_URL: ${REDIS_URL:?set REDIS_URL with the Redis password}
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?set AI_SERVICE_TOKEN}
      LOCAL_STORAGE_DIR: /data/storage
      PROCESSING_TEMP_DIR: /data/storage/tmp
    volumes:
      - storage:/data/storage
    networks: [backend]
    logging: *default-logging
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  ai:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN to the same value as AI_SERVICE_TOKEN}
      LOCAL_STORAGE_DIR: /data/storage
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS to the public https origin}
    volumes:
      - storage:/data/storage
    networks: [backend]
    logging: *default-logging
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL to the public https origin}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    networks: [backend]
    logging: *default-logging
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/web-health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./deploy/certs}:/etc/nginx/certs:ro
      - certbot-www:/var/www/certbot:ro
    networks: [backend]
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-check-certificate -q -O /dev/null https://127.0.0.1/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql-data:
  redis-data:
  storage:
  certbot-www:

networks:
  backend:
    driver: bridge
